[package]
name = "tang-compute"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native GPU compute backends via tang-expr multi-target codegen"
repository.workspace = true
readme = "README.md"
keywords = ["gpu", "metal", "cuda", "compute", "codegen"]
categories = ["hardware-support", "science"]
include = ["src/**/*", "README.md", "build.rs"]

[features]
default = []
metal = ["dep:metal", "dep:objc"]
cuda = ["dep:cudarc"]

[[bin]]
name = "flash-kernel-bench"
path = "src/bin/flash_kernel_bench.rs"
required-features = ["cuda"]

[dependencies]
tang = { workspace = true, features = ["std"] }
tang-expr = { workspace = true }
bytemuck = { workspace = true }
metal = { version = "0.33", optional = true }
objc = { version = "0.2", optional = true }
cudarc = { version = "0.16", default-features = false, features = ["std", "driver", "nvrtc", "cublas", "dynamic-loading", "cuda-12080"], optional = true }

[build-dependencies]

[dev-dependencies]
# Path only, so publishing strips it: only the kvdec example uses it.
cram-codec = { path = "../cram-codec" }

[[example]]
# Metal on the Mac, CUDA on a GPU box: either feature (the example cfg-picks the device)
name = "kvdec_bench"
required-features = []

[[example]]
name = "dump_coder_gdn"
required-features = ["cuda"]
