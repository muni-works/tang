[package]
name = "tang-derive-wasm"
version = "0.1.0"
edition = "2021"
description = "Derive attention kernels in the browser: a typed variant -> tensor IR -> rewrites -> WGSL"
# a cdylib for the tang research post, not a library crate
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tang-compile = { workspace = true }
tang-expr = { workspace = true }
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
