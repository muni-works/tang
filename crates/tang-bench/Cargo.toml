[package]
name = "tang-bench"
version.workspace = true
edition.workspace = true
# benchmarks and their fixtures, not an API anyone depends on
publish = false

[lib]
name = "tang_bench"

[[bench]]
name = "fixed_size"
harness = false

[[bench]]
name = "dense_la"
harness = false

[[bench]]
name = "autodiff"
harness = false

[[bench]]
name = "differentiable"
harness = false

[[bench]]
name = "expr_graph"
harness = false

[[bench]]
name = "gpu_training"
harness = false

[[bench]]
name = "cpu_training"
harness = false

[[bench]]
name = "gpu_inference"
harness = false

[[bench]]
name = "kernels_vs_ir"
harness = false

[features]
default = []
# Native Metal backend for the tensor IR (MSL emitter + runtime).
metal = ["dep:metal"]
# CUDA backend of tang-gpu's program runner for `TensorGraph::to_cuda`
# programs (cudarc, dynamic loading of libcuda/libnvrtc at run time).
cuda = ["tang-gpu/cuda"]
# ds_multi_gpu collectives on device buffers (tang-moe NCCL; libnccl loaded at run time)
nccl = ["cuda", "dep:tang-moe", "tang-moe/nccl"]
# Vulkan decode kernels as GLSL -> SPIR-V (shaderc, built from source).
glsl = ["tang-gpu/glsl"]
# OpenCL decode kernels (`to_opencl_decode`) on tang-gpu's OpenCL runtime: TANG_BACKEND=opencl
opencl = ["tang-gpu/opencl"]
# OpenTelemetry (crates/tang-otel): qwen_session prefill/decode spans, tuner runs, and
# tang-gpu's OpenCL builds and sampled kernel times. OTLP/JSON lines to a file by default.
otel = ["dep:tang-otel", "tang-gpu/otel"]
# GGUF checkpoints through tang-llm's reader: ir_coder_real (Qwen3-Coder-Next
# at real size from its derived graph) and the coder_derived runner.
gguf = ["dep:tang-llm"]
# Qwen3-Coder-Next served from its derived step (`coder_serve`, TANG_CODER_ENGINE=derived):
# tang-llm's server and flash engines need its CUDA build.
coder-serve = ["cuda", "gguf", "tang-llm/cuda", "dep:anyhow"]
# Reassociable float ops in hot reductions. Requires Rust 1.98+.
threads = ["tang-la/threads", "tang-tensor/threads", "tang-train/threads", "tang-infer/threads"]
algebraic = [
    "tang/algebraic",
    "tang-la/algebraic",
    "tang-tensor/algebraic",
    "tang-train/algebraic",
    "tang-infer/algebraic",
]

[[example]]
name = "algebraic_reductions"

[[example]]
name = "coder_derived"
required-features = ["cuda", "gguf"]

[[example]]
name = "coder_serve"
required-features = ["coder-serve"]

[[example]]
name = "glm_real_gpu"
required-features = ["cuda", "gguf"]

[[example]]
name = "ds_real_gpu"
required-features = ["cuda"]

[[example]]
name = "ds_multi_gpu"
required-features = ["cuda"]

[dependencies]
tang        = { workspace = true, features = ["std"] }
tang-la     = { workspace = true, features = ["std"] }
tang-ad     = { workspace = true }
tang-expr   = { workspace = true }
tang-compile = { workspace = true }
tang-gpu    = { workspace = true }
tang-train  = { workspace = true }
tang-tensor = { workspace = true }
tang-infer  = { workspace = true }
metal       = { version = "0.33", optional = true }
# qwen_session: the MLX checkpoint (mapped), config.json and the tokenizer
memmap2 = "0.9"
serde_json = "1"
tokenizers = { workspace = true }
tang-otel = { workspace = true, optional = true }
tang-llm = { workspace = true, optional = true }
anyhow = { version = "1", optional = true }
tang-moe = { workspace = true, optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
nalgebra  = "0.33"
glam      = "0.29"
rand      = "0.8"
rayon     = "1"
tang-derive-wasm = { path = "../tang-derive-wasm" }
# ir_glm_prefill tests (flash::glm5) and ir_coder_prefill (flash::reference):
# tang-llm's CPU references as oracles
tang-llm = { workspace = true }

[[example]]
name = "algebraic_bits"

[[example]]
name = "algebraic_e2e"

[[example]]
name = "msl_kernels"
required-features = ["metal"]

[[example]]
name = "conv_frag"
required-features = ["metal"]

[[example]]
name = "cuda_half_matmul"
required-features = ["cuda"]

[[example]]
name = "scan_bench"
required-features = ["cuda"]

[[example]]
name = "figure1_cuda"
required-features = ["cuda"]

[[example]]
name = "floors_cuda"
required-features = ["cuda"]

[[example]]
name = "attention_fragments"
required-features = ["metal"]
