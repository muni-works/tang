[package]
name = "tang-compile"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Graph optimization and compilation passes for tang"
repository.workspace = true
documentation = "https://docs.rs/tang-compile"
readme = "README.md"
keywords = ["compiler", "graph", "optimization", "codegen"]
categories = ["compilers", "mathematics"]
include = ["src/**/*", "README.md", "LICENSE-MIT", "LICENSE-APACHE", "examples/**/*"]

[dependencies]
tang      = { workspace = true }
tang-expr = { workspace = true }
tang-sparse = { workspace = true }

[dev-dependencies]
# reference f32 -> f16 rounding for the GLSL decode prelude
half = "2"
# validates the caps lowerings (subgroups, f16) with the workspace naga
naga = { version = "25", features = ["wgsl-in"] }
